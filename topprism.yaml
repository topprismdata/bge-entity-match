business_question:
  en: >-
    When two enterprise systems describe a store or company differently,
    are they referring to the same real-world entity, and how can this
    decision be made reliable enough to feed downstream territory,
    opportunity and visit decisions?
  zh: >-
    当两个企业系统对同一家门店或公司有不同描述时，它们是否指向同一个
    现实实体？这个判断需要达到怎样的可靠性，才能支撑下游的商圈、
    机会点与拜访决策？

